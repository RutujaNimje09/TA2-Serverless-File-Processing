AWSTemplateFormatVersion: '2010-09-09'
Description: TA-2 event-driven serverless file processing using S3, Lambda, VPC, NAT Gateway, and SNS.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name (lowercase letters, numbers, and hyphens).
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Use 3-63 lowercase letters, numbers, dots, or hyphens; start and end with a letter or number.
  NotificationEmail:
    Type: String
    Description: Email address that will receive processing notifications.

Resources:
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-IGW

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-PublicSubnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-PrivateSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-PublicRT

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-NAT

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-PrivateRT

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access for Lambda in private subnet
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-LambdaSG

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: File Processing Alerts

  FileProcessingEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: TA2-S3ReadWriteAndSNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadUploadedFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/uploads/*'
              - Sid: WriteProcessedMetadata
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/processed/*'
              - Sid: PublishProcessingAlerts
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          TOPIC_ARN: !Ref FileProcessingTopic
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  response = s3.get_object(Bucket=bucket, Key=key)
                  body = response["Body"]
                  sample = body.read(1024).decode("utf-8", errors="replace")
                  metadata = {
                      "status": "processed",
                      "source_bucket": bucket,
                      "source_key": key,
                      "size_bytes": response.get("ContentLength", 0),
                      "sample_first_1024_chars": sample,
                      "processed_at_utc": datetime.now(timezone.utc).isoformat()
                  }
                  output_key = "processed/" + key.rsplit("/", 1)[-1] + ".metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=output_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json",
                      ServerSideEncryption="AES256"
                  )
                  message = (
                      "File processing successful.\n"
                      f"Source: s3://{bucket}/{key}\n"
                      f"Metadata: s3://{bucket}/{output_key}\n"
                      f"Size: {metadata['size_bytes']} bytes"
                  )
                  sns.publish(
                      TopicArn=os.environ["TOPIC_ARN"],
                      Subject="TA-2 file processed successfully",
                      Message=message
                  )
                  results.append({"source_key": key, "metadata_key": output_key})
              print(json.dumps({"processed_files": results}))
              return {"statusCode": 200, "body": json.dumps(results)}

  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - FileProcessorInvokePermission
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  FileProcessorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FileProcessorFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'

Outputs:
  S3BucketName:
    Description: Upload test files under uploads/ in this bucket.
    Value: !Ref FileBucket
  LambdaFunctionName:
    Description: Lambda function deployed in the private subnet.
    Value: !Ref FileProcessorFunction
  SNSTopicArn:
    Description: SNS topic ARN for processing notifications.
    Value: !Ref FileProcessingTopic
  VPCId:
    Description: VPC created for this practical.
    Value: !Ref FileProcessingVPC
  PrivateSubnetId:
    Description: Private subnet containing Lambda.
    Value: !Ref PrivateSubnet
